<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mis Gastos">
  <title>Mis Gastos</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #f4f7fb;
    }

    .topbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
      background: #111827;
      color: white;
      font-size: 13px;
      font-weight: bold;
    }

    .topbar a {
      color: white;
      background: #2563eb;
      text-decoration: none;
      padding: 8px 11px;
      border-radius: 10px;
      white-space: nowrap;
    }

    iframe {
      width: 100%;
      flex: 1;
      border: 0;
      background: white;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: #f4f7fb;
      color: #111827;
      font-weight: bold;
      transition: opacity .25s ease;
    }

    .loader.hide {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .fallback {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      max-width: 320px;
      padding: 0 16px;
    }

    @media (display-mode: standalone) {
      .topbar {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar" id="topbar">
      <span>💰 Mis Gastos</span>
      <a href="https://script.google.com/macros/s/AKfycbw0E7c6AYsA49fTLR59Az7CXbgsvAJcrjdhKNf1ZybQqYP_QFHh341k5qcjsJn6RqEI/exec" target="_blank" rel="noopener">
        Abrir directamente
      </a>
    </div>

    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbw0E7c6AYsA49fTLR59Az7CXbgsvAJcrjdhKNf1ZybQqYP_QFHh341k5qcjsJn6RqEI/exec"
      title="Mis Gastos"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div>Cargando Mis Gastos…</div>
    <div class="fallback">
      Si demora demasiado, recargá la página o abrí la aplicación directamente.
    </div>
  </div>

  <script>
    const frame = document.getElementById('appFrame');
    const loader = document.getElementById('loader');

    frame.addEventListener('load', () => {
      setTimeout(() => loader.classList.add('hide'), 400);
    });

    setTimeout(() => {
      loader.classList.add('hide');
    }, 8000);
  </script>
</body>
</html>
